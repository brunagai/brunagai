.p1 { animation: cycle1 12s infinite; }
.p2 { animation: cycle2 12s infinite; }
.p3 { animation: cycle3 12s infinite; }
.p4 { animation: cycle4 12s infinite; }

@keyframes cycle1 {
  0% { opacity: 0; }
  3% { opacity: 1; }
  21% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cycle2 {
  0%, 25% { opacity: 0; }
  28% { opacity: 1; }
  46% { opacity: 1; }
  49% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cycle3 {
  0%, 50% { opacity: 0; }
  53% { opacity: 1; }
  71% { opacity: 1; }
  74% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cycle4 {
  0%, 75% { opacity: 0; }
  78% { opacity: 1; }
  96% { opacity: 1; }
  99% { opacity: 0; }
  100% { opacity: 0; }
}
