@keyframes cycle1 {
  0% { opacity: 0; }
  2.5% { opacity: 1; }
  22.5% { opacity: 1; }
  25% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cycle2 {
  0%, 25% { opacity: 0; }
  27.5% { opacity: 1; }
  47.5% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cycle3 {
  0%, 50% { opacity: 0; }
  52.5% { opacity: 1; }
  72.5% { opacity: 1; }
  75% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cycle4 {
  0%, 75% { opacity: 0; }
  77.5% { opacity: 1; }
  97.5% { opacity: 1; }
  100% { opacity: 0; }
}
